name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (API 36.1)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK (only when signing secrets are set)
        id: signed
        continue-on-error: true
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.LUMINA_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.LUMINA_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Signing secrets not set: skipping signed release build."; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then for f in app/build/outputs/apk/release/*.apk; do "$APKSIGNER" verify --print-certs "$f" | grep -i 'SHA-256'; done; fi
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
